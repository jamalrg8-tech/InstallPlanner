<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Eurolux WA Production Tracker</title>
<meta name="description" content="Factory view of the WA production tracker — glass/frame/coating fabrication status.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WA Tracker">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F7F7;
    --surface:#FFFFFF;
    --surface-2:#F0F0F0;
    --border:#E5E5E5;
    --border-strong:#CCCCCC;
    --text:#1A1A1A;
    --text-muted:#3D3D3D;
    --text-faint:#6B6B6B;
    --accent:#000000;
    --accent-soft:#F0F0F0;
    --accent-strong:#333333;
    --accent-ink:#FFFFFF;
    --danger:#B91C1C;
    --danger-soft:#FEE2E2;
    --success:#15803D;
    --success-soft:#DCFCE7;
    --shadow:0 2px 8px rgba(0,0,0,.08);
    --shadow-lg:0 6px 24px rgba(0,0,0,.12);
    --radius:4px;
    --nav-bg:#000000;
    --nav-text:#FFFFFF;
    --nav-border:rgba(255,255,255,.25);
    --nav-hover:rgba(255,255,255,.12);
    --nav-active:rgba(255,255,255,.16);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121212; --surface:#1C1C1C; --surface-2:#262626;
      --border:#333333; --border-strong:#454545;
      --text:#EDEDED; --text-muted:#C4C4C4; --text-faint:#949494;
      --accent:#FFFFFF; --accent-soft:#2A2A2A; --accent-strong:#CCCCCC; --accent-ink:#000000;
      --danger:#FF6B6B; --danger-soft:#4A2020;
      --success:#4ADE80; --success-soft:#173B26;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.35);
      --shadow-lg:0 6px 24px rgba(0,0,0,.5);
      --nav-bg:#000000; --nav-text:#FFFFFF; --nav-border:rgba(255,255,255,.25); --nav-hover:rgba(255,255,255,.12); --nav-active:rgba(255,255,255,.16);
    }
  }
  :root[data-theme="dark"]{
    --bg:#121212; --surface:#1C1C1C; --surface-2:#262626;
    --border:#333333; --border-strong:#454545;
    --text:#EDEDED; --text-muted:#C4C4C4; --text-faint:#949494;
    --accent:#FFFFFF; --accent-soft:#2A2A2A; --accent-strong:#CCCCCC; --accent-ink:#000000;
    --danger:#FF6B6B; --danger-soft:#4A2020;
    --success:#4ADE80; --success-soft:#173B26;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px rgba(0,0,0,.35);
    --shadow-lg:0 6px 24px rgba(0,0,0,.5);
    --nav-bg:#000000; --nav-text:#FFFFFF; --nav-border:rgba(255,255,255,.25); --nav-hover:rgba(255,255,255,.12); --nav-active:rgba(255,255,255,.16);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  [hidden]{ display:none !important; }
  body{
    background:var(--bg); color:var(--text);
    font-family:"Montserrat",system-ui,-apple-system,sans-serif;
    font-size:13px; line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  h1{font-family:"Playfair Display",Georgia,serif; text-wrap:balance; margin:0;}
  h2{font-family:"Montserrat",sans-serif; font-weight:700; text-wrap:balance; margin:0;}
  ::selection{background:var(--accent-soft);}
  button{font-family:inherit;}
  input[type="checkbox"],input[type="radio"]{ accent-color:var(--accent); }
  :focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  .app{ max-width:100%; padding:20px 24px 32px; display:flex; flex-direction:column; gap:16px; }

  .toolbar{
    position:relative;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px 24px;
    background:var(--nav-bg); color:var(--nav-text);
    padding:14px 20px; border-radius:6px; box-shadow:var(--shadow);
  }
  .toolbar h1{ font-size:19px; font-weight:700; letter-spacing:-0.01em; color:var(--nav-text); }
  .toolbar .sub{ font-size:12px; color:rgba(255,255,255,.6); margin-top:4px; }
  /* Live clock (top-left, under the title) and last-updated stamp (pinned to
     the toolbar's top-right corner regardless of how the action buttons
     wrap) — a quick-glance sense of "is this screen current" for a factory
     display nobody is actively clicking around on. */
  .live-clock{ font-size:12px; color:rgba(255,255,255,.6); margin-top:4px; font-variant-numeric:tabular-nums; }
  .last-updated{
    position:absolute; top:14px; right:20px;
    font-size:11px; color:rgba(255,255,255,.55); white-space:nowrap;
  }
  @media (max-width:640px){
    /* Too narrow for an absolutely-positioned corner badge without risking
       overlap with a wrapped title — falls back to a plain line under the
       clock instead. */
    .last-updated{ position:static; margin-top:2px; }
  }
  .toolbar-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:0.56rem 1.05rem; border-radius:var(--radius); border:1px solid var(--border-strong);
    background:var(--surface); color:var(--text); font-size:0.78rem; font-weight:600;
    cursor:pointer; box-shadow:none; white-space:nowrap;
  }
  .btn:hover{ border-color:var(--text-muted); background:var(--surface-2); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn.danger{ background:var(--danger); border-color:var(--danger); color:#fff; }
  .btn.danger:hover{ background:var(--danger); border-color:var(--danger); filter:brightness(1.1); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .import-input{ display:none; }

  .toolbar .btn{ background:transparent; border:1px solid var(--nav-border); color:var(--nav-text); box-shadow:none; border-radius:999px; }
  .toolbar .btn:hover{ background:var(--nav-hover); border-color:var(--nav-border); }
  .toolbar .btn.primary{ background:#fff; border-color:#fff; color:#000; }
  .toolbar .btn.primary:hover{ background:#e5e5e5; border-color:#e5e5e5; }

  .sync-status{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-muted); font-family:"Montserrat",sans-serif; padding:7px 12px; border:1px solid var(--border); border-radius:100px; background:var(--surface); white-space:nowrap; }
  .sync-dot{ width:8px; height:8px; border-radius:50%; flex:none; background:var(--text-faint); }
  .sync-status.state-synced{ border-color:#15803D; color:var(--text); }
  .sync-status.state-synced .sync-dot{ background:#15803D; }
  .sync-status.state-syncing .sync-dot{ background:#B45309; animation:sync-pulse 1s ease-in-out infinite; }
  .sync-status.state-local{ color:var(--text-muted); }
  .sync-status.state-local .sync-dot{ background:var(--text-faint); }
  .sync-status.state-error{ border-color:var(--danger); color:var(--danger); }
  .sync-status.state-error .sync-dot{ background:var(--danger); }
  .sync-status.state-connecting .sync-dot{ background:var(--accent); animation:sync-pulse 1s ease-in-out infinite; }
  .toolbar .sync-status{ background:transparent; border-color:var(--nav-border); color:rgba(255,255,255,.8); }
  .toolbar .sync-status.state-local{ color:rgba(255,255,255,.55); }
  .toolbar .sync-status.state-connecting .sync-dot{ background:#ffffff; }
  @keyframes sync-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }

  /* ---- Search (filters rows by Project Name — see matchesSearch()) ---- */
  .search-box{ position:relative; display:flex; align-items:center; }
  .search-field{ width:230px; max-width:100%; padding:8px 30px 8px 12px; border-radius:var(--radius); border:1px solid var(--border-strong); background:var(--surface); color:var(--text); font-family:inherit; font-size:13px; box-shadow:none; }
  .search-field:focus{ outline:none; border-color:var(--accent); }
  .search-field::-webkit-search-cancel-button{ display:none; }
  .search-clear{ position:absolute; right:6px; background:none; border:none; color:var(--text-faint); font-size:16px; line-height:1; cursor:pointer; padding:4px 6px; border-radius:4px; }
  .search-clear:hover{ background:var(--surface-2); color:var(--text); }
  .toolbar .search-field{ background:rgba(255,255,255,.08); border:1px solid var(--nav-border); color:#fff; border-radius:999px; }
  .toolbar .search-field::placeholder{ color:rgba(255,255,255,.5); }
  .toolbar .search-field:focus{ border-color:#fff; }
  .toolbar .search-clear{ color:rgba(255,255,255,.7); }
  .toolbar .search-clear:hover{ background:var(--nav-hover); color:#fff; }

  /* ---- Group-by-project banded rows (see buildRenderPlan()/toggleGroup()
     below) — a full-width divider row inserted before each cluster of rows
     that share a Project Name, clickable to collapse/expand just that
     group. Sticky right under the column header so, once you've scrolled
     past a group's header, you can still see which project the rows
     beneath it belong to; the next group's header simply takes over that
     same sticky slot as it scrolls up. ---- */
  .wa-group-row{ padding:0; background:var(--surface-2); border-bottom:1px solid var(--border-strong); position:sticky; top:56px; z-index:8; }
  .wa-group-toggle{ width:100%; height:100%; display:flex; align-items:center; gap:10px; padding:0 14px; background:none; border:none; cursor:pointer; text-align:left; font-family:inherit; }
  .wa-group-toggle:hover{ background:var(--border); }
  .wa-group-chevron{ font-size:10px; color:var(--text-muted); width:12px; flex:none; text-align:center; }
  .wa-group-name{ font-weight:700; font-size:12.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wa-group-count{ font-size:11px; color:var(--text-muted); font-weight:600; background:var(--surface); border:1px solid var(--border-strong); border-radius:100px; padding:1px 8px; flex:none; }

  .board-wrap{ border:1px solid var(--border); border-radius:6px; box-shadow:var(--shadow); background:var(--surface); overflow:hidden; }
  .board-scroll{ overflow:auto; max-height:calc(100vh - 170px); min-height:260px; }
  .board{ display:grid; position:relative; width:max-content; }
  .board .row-head{ display:none; }

  .cell{ border-right:1px solid var(--border); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 8px; background:var(--surface); min-width:0; }
  /* A delivered line-item's whole row goes green so it's obvious at a glance
     while scanning the board -- set once here per the shared row-delivered
     class wa-shared.js's rowHTML() adds to every cell, same as InstallPlanner.html. */
  .cell.row-delivered{ background:var(--success-soft); }
  .meta-head{ position:sticky; top:0; z-index:9; background:#000000; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:#ffffff; border-bottom:1px solid #000000; }

  .field{ width:100%; border:1px solid transparent; background:transparent; color:var(--text); font-family:inherit; font-size:12.5px; padding:6px 4px; border-radius:6px; min-width:0; }
  .field::placeholder{ color:var(--text-faint); opacity:1; }
  input.field{ text-overflow:ellipsis; }
  .field:hover{ background:var(--surface-2); }
  .field:focus{ background:var(--surface); border-color:var(--accent); outline:none; }
  textarea.field{ resize:none; font-family:inherit; line-height:1.3; height:44px; }
  textarea.field.autosize-field{ height:auto; min-height:44px; overflow:hidden; }
  select.field{ font-size:12px; font-weight:600; padding:5px 4px; cursor:pointer; }

  .date-btn{ width:100%; height:100%; border:1px solid transparent; background:transparent; color:var(--text); font-family:"Montserrat",sans-serif; font-size:11.5px; padding:6px 4px; border-radius:6px; text-align:left; cursor:pointer; }
  .date-btn:hover{ background:var(--surface-2); }
  .date-btn.active, .date-btn:focus-visible{ background:var(--surface); box-shadow:inset 0 0 0 1px var(--accent); outline:none; }
  .date-btn.placeholder{ color:var(--text-faint); }

  .date-popup{ position:fixed; z-index:220; width:236px; background:var(--surface); border:1px solid var(--border-strong); border-radius:6px; box-shadow:var(--shadow); padding:10px; font-size:12.5px; }
  .date-popup[hidden]{ display:none; }
  .date-popup-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .date-popup-nav{ background:none; border:none; color:var(--text-muted); font-size:15px; line-height:1; cursor:pointer; padding:4px 8px; border-radius:6px; }
  .date-popup-nav:hover{ background:var(--surface-2); color:var(--text); }
  .date-popup-label{ font-weight:700; font-size:12.5px; }
  .date-popup-dow{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px; }
  .date-popup-days{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .date-popup-day{ background:none; border:none; color:var(--text); font-family:inherit; font-size:12px; padding:6px 0; border-radius:6px; cursor:pointer; }
  .date-popup-day:hover{ background:var(--surface-2); }
  .date-popup-day.muted{ color:var(--text-faint); }
  .date-popup-day.today{ box-shadow:inset 0 0 0 1px var(--accent); }
  .date-popup-day.selected{ background:var(--accent); color:var(--accent-ink); font-weight:700; }
  .date-popup-foot{ display:flex; justify-content:space-between; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }
  .date-popup-link{ background:none; border:none; color:var(--accent); font-family:inherit; font-size:11.5px; font-weight:600; cursor:pointer; padding:2px 4px; }
  .date-popup-link:hover{ text-decoration:underline; }

  .del-btn{ width:22px; height:22px; border-radius:6px; border:1px solid transparent; background:transparent; color:var(--text-faint); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .del-btn:hover{ background:var(--danger-soft); color:var(--danger); border-color:var(--danger); }

  .wc-idx{ position:relative; width:var(--wa-w-idx, 40px); justify-content:center; padding:0; }
  .wc-no{ width:var(--wa-w-no, 56px); }
  .wc-jobno{ width:var(--wa-w-jobno, 86px); }
  .wc-projectname{ width:var(--wa-w-projectname, 190px); }
  .wc-lporef{ width:var(--wa-w-lporef, 100px); }
  .wc-ralcolour{ width:var(--wa-w-ralcolour, 110px); }
  .wc-deliverydate{ width:var(--wa-w-deliverydate, 150px); }
  .wc-delivered{ width:var(--wa-w-delivered, 88px); }
  .wc-description{ width:var(--wa-w-description, 170px); }
  .wc-itemqty{ width:var(--wa-w-itemqty, 76px); }
  .wc-scope{ width:var(--wa-w-scope, 220px); }
  .wc-etacoating{ width:var(--wa-w-etacoating, 170px); }
  .wc-etaframe{ width:var(--wa-w-etaframe, 170px); }
  .wc-etashutter{ width:var(--wa-w-etashutter, 170px); }
  .wc-remarks{ width:var(--wa-w-remarks, 200px); }

  /* Column resize handles — see the matching comment in InstallPlanner.html;
     .meta-head already establishes position:sticky (above), which also
     serves as the containing block these absolutely-positioned handles need. */
  .wa-col-handle{ position:absolute; top:0; right:-3px; width:6px; height:100%; cursor:col-resize; z-index:10; background:transparent; }
  .wa-col-handle:hover, .wa-col-handle.dragging{ background:var(--text-faint); opacity:.7; }

  /* Always-reachable "shadow" horizontal scrollbar pinned above the table —
     see the matching comment in InstallPlanner.html. */
  .board-wrap .board-scroll{ overflow-x:hidden; }
  .wa-hbar{ overflow-x:auto; overflow-y:hidden; height:14px; border-bottom:1px solid var(--border); background:var(--surface-2); }
  .wa-hbar-inner{ height:1px; }

  .wa-rowheight-label{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-muted); white-space:nowrap; }
  .wa-rowheight-label select{ width:auto; padding:6px 8px; }

  .empty-state{ padding:40px 20px; text-align:center; color:var(--text-muted); font-size:13px; }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:6px; font-size:13px; box-shadow:var(--shadow-lg); display:flex; gap:14px; align-items:center; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .toast.show{ opacity:1; pointer-events:auto; }
  .toast a{ color:var(--accent-strong); font-weight:600; cursor:pointer; text-decoration:underline; }

  .confirm-modal-backdrop{ position:fixed; inset:0; background:rgba(20,24,29,.5); display:flex; align-items:center; justify-content:center; z-index:210; padding:24px; }
  .confirm-modal-backdrop[hidden]{ display:none; }
  .confirm-modal-card{ background:var(--surface); border-radius:8px; box-shadow:var(--shadow); width:min(380px, 100%); padding:20px; }
  .confirm-modal-card h2{ font-size:15px; font-weight:700; margin-bottom:8px; }
  .confirm-modal-card p{ font-size:13px; color:var(--text-muted); line-height:1.45; }
  .confirm-modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:18px; }

  .app-footer{ text-align:center; font-size:11px; color:var(--text-faint); padding:8px 0 4px; }

  @media (prefers-reduced-motion: reduce){ .toast{ transition:none; } }
</style>
</head>
<body>

<div class="app">
  <div class="toolbar">
    <div>
      <h1>Eurolux WA Production Tracker</h1>
      <div class="sub">Factory view — this page shows and edits only this tracker.</div>
      <div class="live-clock" id="live-clock" aria-live="off"></div>
    </div>
    <div class="last-updated" id="last-updated" title="When this tracker was last changed, by anyone">Last updated: —</div>
    <div class="toolbar-actions">
      <div class="search-box">
        <input type="search" class="search-field" id="search-input" placeholder="Search project name…" aria-label="Search rows by project name">
        <button type="button" class="search-clear" id="search-clear-btn" hidden aria-label="Clear search">×</button>
      </div>
      <div class="sync-status" id="sync-status" title="Whether your changes are shared with the office or saved on just this device">
        <span class="sync-dot"></span><span id="sync-label"></span>
      </div>
      <button class="btn" id="add-btn" type="button">+ Add row</button>
      <button class="btn" id="import-btn" type="button">Import Excel / CSV</button>
      <input class="import-input" id="import-input" type="file" accept=".xlsx,.xls,.csv">
      <button class="btn" id="export-xlsx-btn" type="button">Export Excel</button>
      <button class="btn" id="export-pdf-btn" type="button">Export PDF</button>
      <button class="btn" id="group-toggle-btn" type="button" aria-pressed="false" title="Group rows that share the same Project Name">Group by project</button>
      <label class="wa-rowheight-label">Row height
        <select id="rowheight-select" class="field">
          <option value="compact">Compact</option>
          <option value="comfortable" selected>Comfortable</option>
          <option value="expanded">Expanded</option>
        </select>
      </label>
      <button class="btn" id="reset-cols-btn" type="button" title="Reset column widths and row height back to defaults">Reset columns</button>
    </div>
  </div>

  <div class="board-wrap">
    <div class="wa-hbar" id="wa-hbar" title="Drag to scroll across all columns"><div class="wa-hbar-inner" id="wa-hbar-inner"></div></div>
    <div class="board-scroll" id="board-scroll">
      <div class="board wa-board" id="wa-board"></div>
    </div>
  </div>

  <div class="app-footer">Eurolux Doors and Windows — WA Production Tracker</div>
</div>

<div class="toast" id="toast"></div>
<div class="date-popup" id="date-popup" hidden></div>

<div class="confirm-modal-backdrop" id="confirm-modal-backdrop" hidden>
  <div class="confirm-modal-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-modal-title" aria-describedby="confirm-modal-body">
    <h2 id="confirm-modal-title">Delete this row?</h2>
    <p id="confirm-modal-body"></p>
    <div class="confirm-modal-actions">
      <button type="button" class="btn" id="confirm-modal-cancel">Cancel</button>
      <button type="button" class="btn danger" id="confirm-modal-delete">Delete</button>
    </div>
  </div>
</div>

<!-- Shared backend (Firebase/Firestore) — the SAME document the main planner
     uses, so edits here show up there and vice versa. This page only ever
     reads and writes the "waRows" field of that document (see doSave()
     below); it never touches "projects", "customTeams" or
     "bannerDismissed", so it can't affect the project schedule even though
     it's the same document. Safe to load even when not configured — falls
     back to this-device-only storage automatically, same as the main
     planner. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="./firebase-config.js"></script>

<!-- Excel / CSV import and export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- PDF export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<!-- WA production tracker's shared data model + rendering (window.WA) —
     the same file InstallPlanner.html uses for its "WA Tracker" tab, so
     rows render identically in both places. -->
<script src="./wa-shared.js"></script>

<script>
(function(){
  "use strict";

  var boardEl = document.getElementById("wa-board");
  var state = { waRows: [] };
  var saveTimer = null;
  // True from the instant a Firestore write is kicked off until it settles.
  // Firestore's local-cache echoes a write back through onSnapshot almost
  // immediately, and that echo can land in the gap right after doSave()
  // clears saveTimer but before the write settles. Without this flag, that
  // echo was treated as "no local edit pending" and triggered a full board
  // re-render — rebuilding every input from scratch and stealing focus —
  // which is what made typing feel like it kept getting interrupted.
  var writeInFlight = false;
  var lastSnapshotForUndo = null;

  // ---- search + group-by-project (this page's own view-only state — never
  // saved to the shared backend, since it's just how THIS device is
  // currently looking at the list, not part of the data itself). Search
  // matches the same way the main planner's project-name search does: a
  // case-insensitive substring match. Which groups are collapsed, and
  // whether grouping is on at all, persist per-device in localStorage (same
  // pattern as the column-width/row-height prefs below) so reopening the
  // page keeps how you last left it. ----
  var searchQuery = "";
  var groupByProject = false;
  var collapsedGroups = {}; // key: trimmed Project Name -> true if collapsed
  var GROUP_PREFS_KEY = "installPlanner.waGroupPrefs.v1";

  function loadGroupPrefs(){
    try{
      var raw = localStorage.getItem(GROUP_PREFS_KEY);
      if (!raw) return;
      var data = JSON.parse(raw);
      if (data && typeof data.groupByProject === "boolean") groupByProject = data.groupByProject;
      if (data && data.collapsed && typeof data.collapsed === "object") collapsedGroups = data.collapsed;
    } catch(e){ /* corrupt or inaccessible storage — fall back to defaults */ }
  }
  function saveGroupPrefs(){
    try{ localStorage.setItem(GROUP_PREFS_KEY, JSON.stringify({ groupByProject:groupByProject, collapsed:collapsedGroups })); } catch(e){}
  }

  function matchesSearch(row){
    if (!searchQuery) return true;
    return (row.projectName||"").toLowerCase().indexOf(searchQuery) > -1;
  }

  // Clusters the (already search-filtered) rows by Project Name, preserving
  // each project's first-appearance order rather than re-sorting the list —
  // so grouping just pulls a project's line-items together without
  // reshuffling which project comes before which. Rows with a blank
  // Project Name are grouped together under "(No project name)" rather
  // than left ungrouped, so "Group by project" always produces one row per
  // distinct name, blank included.
  function buildRenderPlan(){
    var rows = (state.waRows || []).filter(matchesSearch);
    if (!groupByProject) return rows.map(function(row){ return { type:"row", row:row }; });

    var groups = [];
    var byKey = {};
    rows.forEach(function(row){
      var key = (row.projectName||"").trim();
      if (!byKey[key]){
        byKey[key] = { key:key, label: key || "(No project name)", rows:[] };
        groups.push(byKey[key]);
      }
      byKey[key].rows.push(row);
    });

    var plan = [];
    groups.forEach(function(g){
      var collapsed = !!collapsedGroups[g.key];
      plan.push({ type:"group", key:g.key, label:g.label, count:g.rows.length, collapsed:collapsed });
      if (!collapsed) g.rows.forEach(function(row){ plan.push({ type:"row", row:row }); });
    });
    return plan;
  }

  function groupHeaderHTML(item, gridRow, totalCols){
    return '<div class="cell wa-group-row" style="grid-column:1 / span '+totalCols+'; grid-row:'+gridRow+';">'+
      '<button type="button" class="wa-group-toggle" data-wa-group-toggle="'+WA.escAttr(item.key)+'" aria-expanded="'+(item.collapsed?"false":"true")+'">'+
        '<span class="wa-group-chevron">'+(item.collapsed?"▸":"▾")+'</span>'+
        '<span class="wa-group-name">'+WA.escText(item.label)+'</span>'+
        '<span class="wa-group-count">'+item.count+' item'+(item.count===1?"":"s")+'</span>'+
      '</button></div>';
  }

  function toggleGroup(key){
    collapsedGroups[key] = !collapsedGroups[key];
    saveGroupPrefs();
    render();
  }

  // Matches wa-shared.js's own HEADER_ROW_H (56px) — kept as a separate
  // constant here since that one's private to wa-shared.js, and this page
  // needs to build its own row-track list to give group-header rows a
  // slimmer, fixed height instead of stretching to the data-row minimum.
  var GROUP_ROW_H = 34;
  function buildGridTemplateRows(plan){
    if (!plan.length) return "56px 64px";
    var tracks = plan.map(function(item){
      return item.type === "group" ? GROUP_ROW_H+"px" : "minmax(var(--wa-row-min-height, 64px), auto)";
    });
    return "56px "+tracks.join(" ");
  }

  // ---- date helpers (same as InstallPlanner.html's — kept local rather
  // than shared, since this is the only page besides InstallPlanner.html
  // that needs a full calendar widget). ----
  function pad2(n){ return (n<10?"0":"")+n; }
  function iso(y,m,d){ return y+"-"+pad2(m)+"-"+pad2(d); }
  function daysInMonth(y,m){ return new Date(Date.UTC(y,m,0)).getUTCDate(); }
  function weekdayOf(y,m,d){ return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }
  function monthName(m){ return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][m-1]; }
  function addMonths(y,m,n){ var total = (m-1)+n; var ny = y + Math.floor(total/12); var nm = (total%12+12)%12 + 1; return {y:ny, m:nm}; }

  function findRow(id){ return state.waRows.find(function(r){ return r.id===id; }); }

  function autosizeTextarea(el){
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }
  function autosizeAllTextareas(container){
    var els = container.querySelectorAll("textarea.autosize-field");
    for (var i=0;i<els.length;i++) autosizeTextarea(els[i]);
  }

  // Same focus-preservation pattern as the main app's render(): capture
  // which field (and cursor position) is focused before rebuilding the
  // board's innerHTML, then restore it afterwards, so a re-render that
  // happens to land while someone's mid-edit (e.g. a legitimate update
  // from someone else editing the same tracker) doesn't kick them out of
  // the field they're typing in.
  function captureFocusInfo(){
    var active = document.activeElement;
    if (!active || !active.matches || !active.matches("[data-wa-field][data-id]")) return null;
    return {
      field: active.dataset.waField,
      id: active.dataset.id,
      selStart: (typeof active.selectionStart === "number") ? active.selectionStart : null,
      selEnd: (typeof active.selectionEnd === "number") ? active.selectionEnd : null
    };
  }
  function restoreFocusInfo(info){
    if (!info) return;
    requestAnimationFrame(function(){
      var again = document.querySelector('[data-wa-field="'+info.field+'"][data-id="'+info.id+'"]');
      if (!again) return;
      again.focus();
      if (info.selStart !== null && again.setSelectionRange){
        try { again.setSelectionRange(info.selStart, info.selEnd); } catch(e){}
      }
    });
  }

  function render(){
    var focusInfo = captureFocusInfo();
    var totalCols = WA.META_LABELS.length;
    var plan = buildRenderPlan();
    boardEl.style.gridTemplateColumns = WA.gridTemplateColumns();
    boardEl.style.gridTemplateRows = buildGridTemplateRows(plan);

    var html = WA.metaHeaderHTML();
    if ((state.waRows||[]).length === 0){
      html += '<div class="cell empty-state" style="grid-column:1 / span '+totalCols+'; grid-row:2; justify-content:center;">'+
        'No rows yet. Click “+ Add row” or use “Import Excel / CSV” to bring in a list.</div>';
    } else if (plan.length === 0){
      html += '<div class="cell empty-state" style="grid-column:1 / span '+totalCols+'; grid-row:2; justify-content:center;">'+
        'No rows match “'+WA.escText(searchQuery)+'”.</div>';
    } else {
      var rowIndex = 0;
      plan.forEach(function(item){
        var gridRow = 2 + rowIndex;
        html += item.type === "group" ? groupHeaderHTML(item, gridRow, totalCols) : WA.rowHTML(item.row, rowIndex);
        rowIndex++;
      });
    }
    boardEl.innerHTML = html;
    autosizeAllTextareas(boardEl);
    restoreFocusInfo(focusInfo);
    if (waControls) waControls.refreshScrollbar();
  }

  // ---- column widths / row height / always-reachable bottom scrollbar —
  // one shared implementation (wa-shared.js) so this page and the "WA
  // Tracker" tab inside InstallPlanner.html never drift apart. Per-device
  // preference, not synced — resizing here only affects this device. ----
  var waControls = WA.createBoardControls({
    storageKey: "installPlanner.waUiPrefs.v1",
    boardEl: boardEl,
    hscrollEl: document.getElementById("board-scroll"),
    hbarEl: document.getElementById("wa-hbar"),
    hbarInnerEl: document.getElementById("wa-hbar-inner")
  });
  document.getElementById("rowheight-select").addEventListener("change", function(e){
    waControls.setRowHeight(e.target.value);
  });
  document.getElementById("reset-cols-btn").addEventListener("click", function(){
    waControls.resetToDefaults();
    document.getElementById("rowheight-select").value = waControls.getRowHeight();
    showToast("Column widths and row height reset.", null, null);
  });

  // ---- search (filters rows by Project Name) ----
  var searchInputEl = document.getElementById("search-input");
  var searchClearBtn = document.getElementById("search-clear-btn");
  function updateSearchClearVisibility(){ searchClearBtn.hidden = !searchInputEl.value; }
  searchInputEl.addEventListener("input", function(){
    searchQuery = String(searchInputEl.value||"").trim().toLowerCase();
    updateSearchClearVisibility();
    render();
  });
  searchClearBtn.addEventListener("click", function(){
    searchInputEl.value = "";
    searchQuery = "";
    updateSearchClearVisibility();
    searchInputEl.focus();
    render();
  });

  // ---- group by project ----
  var groupToggleBtn = document.getElementById("group-toggle-btn");
  function updateGroupToggleBtn(){
    groupToggleBtn.textContent = groupByProject ? "Ungroup" : "Group by project";
    groupToggleBtn.setAttribute("aria-pressed", groupByProject ? "true" : "false");
  }
  groupToggleBtn.addEventListener("click", function(){
    groupByProject = !groupByProject;
    saveGroupPrefs();
    updateGroupToggleBtn();
    render();
  });

  function waExportFilename(ext){
    var d = new Date();
    var iso8601 = d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
    return "Eurolux-WA-Production-Tracker-"+iso8601+"."+ext;
  }
  document.getElementById("export-xlsx-btn").addEventListener("click", function(){
    var ok = WA.exportXLSX(state.waRows, waExportFilename("xlsx"));
    if (!ok) showToast("Couldn't generate the Excel file. Try again, or check your connection.", null, null);
  });
  document.getElementById("export-pdf-btn").addEventListener("click", function(){
    var ok = WA.exportPDF(state.waRows, waExportFilename("pdf"));
    if (!ok) showToast("Couldn't generate the PDF. Try again, or check your connection.", null, null);
  });

  // ---- live clock (top-left) + last-updated stamp (top-right) — see the
  // CSS comment above .live-clock/.last-updated for the layout reasoning.
  // The clock is just wall-clock time, ticking every second. "Last updated"
  // tracks when the shared doc itself was last written — by anyone, on any
  // device — not just edits made in this tab, so it's wired into applyDoc()
  // (every incoming snapshot, including the very first one on load) as well
  // as this page's own successful local-storage saves.
  function fmtClock(d){
    return d.toLocaleString(undefined, { weekday:"short", day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit", second:"2-digit" });
  }
  function fmtLastUpdated(d){
    return d.toLocaleString(undefined, { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
  }
  function tickClock(){
    var el = document.getElementById("live-clock");
    if (el) el.textContent = fmtClock(new Date());
  }
  var lastUpdatedAt = null;
  function renderLastUpdated(){
    var el = document.getElementById("last-updated");
    if (!el) return;
    el.textContent = "Last updated: " + (lastUpdatedAt ? fmtLastUpdated(lastUpdatedAt) : "—");
  }
  // Accepts a JS Date, a Firestore Timestamp (has .toDate()), an ISO string,
  // or nothing (falls back to "now") — whatever the caller happens to have.
  function markUpdated(ts){
    var d = null;
    if (ts instanceof Date && !isNaN(ts)) d = ts;
    else if (ts && typeof ts.toDate === "function") d = ts.toDate();
    else if (typeof ts === "string" && ts){ var parsed = new Date(ts); if (!isNaN(parsed)) d = parsed; }
    lastUpdatedAt = d || new Date();
    renderLastUpdated();
  }

  // ---- persistence: reads/writes ONLY the "waRows" field of the shared
  // doc/local-storage blob — see the note above the script includes. ----
  var STORAGE_KEY = "installPlanner.v1";
  var backendMode = "local";
  var FIREBASE_COLLECTION = "installPlanner";
  var FIREBASE_DOC_ID = "shared";
  var fsDocRef = null;
  var applyingRemoteUpdate = false;

  function firebaseConfigLooksReal(cfg){
    return !!(cfg && cfg.apiKey && cfg.projectId &&
      String(cfg.apiKey).indexOf("YOUR_") !== 0 && String(cfg.projectId).indexOf("YOUR_") !== 0);
  }

  function loadLocalWaRows(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw){
        var data = JSON.parse(raw);
        if (data && Array.isArray(data.waRows)){
          state.waRows = data.waRows.map(WA.normalizeRow);
          if (data.updatedAt) markUpdated(data.updatedAt);
          return;
        }
      }
    } catch(e){ /* corrupt or inaccessible storage */ }
    state.waRows = JSON.parse(JSON.stringify(WA.SEED_ROWS));
  }

  var SYNC_STATES = {
    connecting: { cls:"state-connecting", label:"Connecting…" },
    editing:    { cls:"state-syncing",    label:"Editing…" },
    syncing:    { cls:"state-syncing",    label:"Syncing…" },
    synced:     { cls:"state-synced",     label:"Synced with office" },
    "sync-error": { cls:"state-error",    label:"Sync failed — will retry" },
    "conn-lost":  { cls:"state-error",    label:"Connection lost — editing locally" },
    "local-saved": { cls:"state-local",   label:"Saved on this device only" },
    "local-error": { cls:"state-error",   label:"Couldn't save — storage full or blocked" }
  };
  function setSaveStatus(stateKey){
    var def = SYNC_STATES[stateKey] || { cls:"", label:String(stateKey||"") };
    var badge = document.getElementById("sync-status");
    var label = document.getElementById("sync-label");
    if (!badge || !label) return;
    badge.className = "sync-status " + def.cls;
    label.textContent = def.label;
  }

  function scheduleSave(){
    setSaveStatus("editing");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 600);
  }

  function doSave(){
    clearTimeout(saveTimer);
    saveTimer = null;
    if (applyingRemoteUpdate) return;
    if (backendMode === "firebase" && fsDocRef){
      // A merge write touching ONLY the "waRows" field of the shared
      // document, never "projects"/"customTeams"/"bannerDismissed", so this
      // page can never clobber the project schedule even though it's the
      // same document.
      writeInFlight = true;
      fsDocRef.set({ waRows: state.waRows, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true })
        .then(function(){
          writeInFlight = false;
          setSaveStatus("synced");
          // Optimistic update so the corner stamp reflects "just now" right
          // away rather than waiting on the round-trip; the snapshot echo
          // that follows moments later overwrites this with the real server
          // timestamp anyway (see applyDoc()).
          markUpdated(new Date());
        })
        .catch(function(){ writeInFlight = false; setSaveStatus("sync-error"); });
      return;
    }
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      var data = {};
      try{ data = raw ? JSON.parse(raw) : {}; } catch(e){ data = {}; }
      data.waRows = state.waRows;
      data.updatedAt = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      setSaveStatus("local-saved");
      markUpdated(new Date());
    } catch(err){
      setSaveStatus("local-error");
    }
  }

  function connectFirestore(){
    return new Promise(function(resolve){
      var cfg = window.FIREBASE_CONFIG;
      if (!firebaseConfigLooksReal(cfg) || typeof firebase === "undefined"){
        resolve(false);
        return;
      }
      try{
        if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(cfg);
        var db = firebase.firestore();
        fsDocRef = db.collection(FIREBASE_COLLECTION).doc(FIREBASE_DOC_ID);
        var settled = false;

        function applyDoc(data){
          applyingRemoteUpdate = true;
          var hasPendingLocalEdit = !!saveTimer || writeInFlight;
          if (data && !hasPendingLocalEdit){
            state.waRows = Array.isArray(data.waRows) ? data.waRows.map(WA.normalizeRow) : [];
            // The shared doc's own updatedAt is the truest "last updated" —
            // it reflects whoever (any device, office or factory) last wrote
            // to it, not just edits made in this tab.
            if (data.updatedAt) markUpdated(data.updatedAt);
          }
          applyingRemoteUpdate = false;
          return hasPendingLocalEdit;
        }

        fsDocRef.onSnapshot(function(snap){
          if (!settled){
            if (snap.exists){
              applyDoc(snap.data());
            } else {
              // No shared document yet at all — nobody, factory or office,
              // has used the planner before. Seed it with empty project
              // data (so the main planner degrades to "no projects yet"
              // instead of crashing on a missing field) plus the real WA
              // seed rows.
              state.waRows = JSON.parse(JSON.stringify(WA.SEED_ROWS));
              fsDocRef.set({ projects: [], bannerDismissed:false, customTeams: [], waRows: state.waRows }, { merge: true }).then(function(){});
            }
            backendMode = "firebase";
            settled = true;
            resolve(true);
            return;
          }
          var hasPendingLocalEdit = applyDoc(snap.data());
          if (!hasPendingLocalEdit){ render(); setSaveStatus("synced"); }
        }, function(){
          if (!settled){ settled = true; resolve(false); }
        });
        setTimeout(function(){ if (!settled){ settled = true; resolve(false); } }, 4000);
      } catch(e){
        resolve(false);
      }
    });
  }

  async function initBackend(){
    var ok = await connectFirestore();
    if (!ok){ backendMode = "local"; loadLocalWaRows(); }
  }

  // ---- toast ----
  var toastTimer = null;
  function showToast(msg, actionLabel, actionFn){
    var el = document.getElementById("toast");
    el.innerHTML = msg + (actionLabel ? ' <a id="toast-action">'+actionLabel+'</a>' : "");
    el.classList.add("show");
    if (actionLabel){
      document.getElementById("toast-action").addEventListener("click", function(){
        actionFn(); el.classList.remove("show");
      });
    }
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 6000);
  }
  function undoLast(){
    if (lastSnapshotForUndo){
      state.waRows = lastSnapshotForUndo;
      lastSnapshotForUndo = null;
      render();
      scheduleSave();
    }
  }

  // ---- confirm-delete modal ----
  var pendingDeleteId = null;
  function openDeleteConfirm(id){
    var row = findRow(id);
    if (!row) return;
    pendingDeleteId = id;
    document.getElementById("confirm-modal-title").textContent = "Delete this row?";
    document.getElementById("confirm-modal-body").textContent =
      'Delete "'+(row.projectName || "Untitled row")+'" from the WA production tracker? This can be undone right after with the Undo button, but not once you leave or refresh the page.';
    document.getElementById("confirm-modal-backdrop").hidden = false;
  }
  function closeConfirmModal(){
    pendingDeleteId = null;
    document.getElementById("confirm-modal-backdrop").hidden = true;
  }
  function performDelete(){
    var id = pendingDeleteId;
    closeConfirmModal();
    if (!id) return;
    var idx = state.waRows.findIndex(function(r){ return r.id===id; });
    if (idx>-1){
      lastSnapshotForUndo = JSON.parse(JSON.stringify(state.waRows));
      state.waRows.splice(idx,1);
      render();
      scheduleSave();
      showToast("Row deleted.", "Undo", undoLast);
    }
  }

  // ---- field editing ----
  document.addEventListener("input", function(e){
    var t = e.target;
    if (!t.matches("[data-wa-field]")) return;
    var row = findRow(t.dataset.id);
    if (!row) return;
    var field = t.dataset.waField;
    row[field] = t.value;
    if (field === "delivered"){
      // Flip the whole row's green highlight right away. This board
      // deliberately never calls render() on a field edit (see the comment
      // above the equivalent handler in InstallPlanner.html) so typing never
      // loses focus -- so the "Delivered" dropdown is a special case that
      // patches every cell's class directly instead of waiting for the next
      // full render to pick up the new delivered state.
      var isDelivered = row.delivered === "Yes";
      document.querySelectorAll('#wa-board [data-id="'+row.id+'"]').forEach(function(el){
        var cell = el.closest(".cell");
        if (cell) cell.classList.toggle("row-delivered", isDelivered);
      });
    }
    if (t.classList.contains("autosize-field")) autosizeTextarea(t);
    scheduleSave();
  });

  // ---- date popup (delivery date) — same component as InstallPlanner.html ----
  var datePopupEl = document.getElementById("date-popup");
  var datePopupState = null;

  function renderDatePopup(){
    var st = datePopupState;
    if (!st) return;
    var current = st.currentIso;
    var today = new Date();
    var todayIso = iso(today.getFullYear(), today.getMonth()+1, today.getDate());
    var firstDow = weekdayOf(st.y, st.m, 1);
    var totalDays = daysInMonth(st.y, st.m);
    var prevM = addMonths(st.y, st.m, -1);
    var daysInPrev = daysInMonth(prevM.y, prevM.m);

    var html = '<div class="date-popup-head">'+
      '<button type="button" class="date-popup-nav" data-nav="-1" aria-label="Previous month">&#8249;</button>'+
      '<span class="date-popup-label">'+monthName(st.m)+' '+st.y+'</span>'+
      '<button type="button" class="date-popup-nav" data-nav="1" aria-label="Next month">&#8250;</button>'+
      '</div>'+
      '<div class="date-popup-dow">'+["S","M","T","W","T","F","S"].map(function(d){ return "<span>"+d+"</span>"; }).join("")+'</div>'+
      '<div class="date-popup-days">';

    for (var i=0; i<firstDow; i++){
      var dnum = daysInPrev - firstDow + 1 + i;
      html += '<button type="button" class="date-popup-day muted" data-day="'+iso(prevM.y, prevM.m, dnum)+'">'+dnum+'</button>';
    }
    for (var d=1; d<=totalDays; d++){
      var dIso = iso(st.y, st.m, d);
      var cls = "date-popup-day";
      if (dIso === todayIso) cls += " today";
      if (current && dIso === current) cls += " selected";
      html += '<button type="button" class="'+cls+'" data-day="'+dIso+'">'+d+'</button>';
    }
    var used = firstDow + totalDays;
    var trailing = (7 - (used % 7)) % 7;
    var nextM = addMonths(st.y, st.m, 1);
    for (var j=1; j<=trailing; j++){
      html += '<button type="button" class="date-popup-day muted" data-day="'+iso(nextM.y, nextM.m, j)+'">'+j+'</button>';
    }

    html += '</div>'+
      '<div class="date-popup-foot">'+
      '<button type="button" class="date-popup-link" data-clear="1">Clear</button>'+
      '<button type="button" class="date-popup-link" data-today="1">Today</button>'+
      '</div>';

    datePopupEl.innerHTML = html;
  }

  function positionDatePopup(btn){
    var rect = btn.getBoundingClientRect();
    var popW = datePopupEl.offsetWidth || 236;
    var popH = datePopupEl.offsetHeight || 260;
    var left = Math.min(rect.left, window.innerWidth - popW - 8);
    left = Math.max(8, left);
    var top = rect.bottom + 4;
    if (top + popH > window.innerHeight - 8) top = rect.top - popH - 4;
    if (top < 8) top = 8;
    datePopupEl.style.left = left + "px";
    datePopupEl.style.top = top + "px";
  }

  function openDatePopup(btn){
    var id = btn.dataset.id, field = btn.dataset.waDateBtn;
    var row = findRow(id);
    if (!row) return;
    if (datePopupState && datePopupState.anchor === btn){ closeDatePopup(); return; }
    closeDatePopup();
    var currentIso = row[field];
    var base;
    if (currentIso){ base = { y:+currentIso.slice(0,4), m:+currentIso.slice(5,7) }; }
    else { var t = new Date(); base = { y:t.getFullYear(), m:t.getMonth()+1 }; }
    datePopupState = { currentIso: currentIso||"", y:base.y, m:base.m, anchor:btn, onPick:function(isoVal){
      row[field] = isoVal;
      render();
      scheduleSave();
    }};
    btn.classList.add("active");
    renderDatePopup();
    datePopupEl.hidden = false;
    positionDatePopup(btn);
  }
  function closeDatePopup(){
    if (!datePopupState) return;
    if (datePopupState.anchor) datePopupState.anchor.classList.remove("active");
    datePopupState = null;
    datePopupEl.hidden = true;
  }
  function applyDatePick(isoVal){
    var st = datePopupState;
    if (!st) return;
    var onPick = st.onPick;
    closeDatePopup();
    if (onPick) onPick(isoVal);
  }

  datePopupEl.addEventListener("click", function(e){
    var navBtn = e.target.closest("[data-nav]");
    if (navBtn){
      var st = datePopupState;
      if (!st) return;
      var next = addMonths(st.y, st.m, +navBtn.dataset.nav);
      st.y = next.y; st.m = next.m;
      renderDatePopup();
      if (st.anchor) positionDatePopup(st.anchor);
      return;
    }
    var dayBtn = e.target.closest("[data-day]");
    if (dayBtn){ applyDatePick(dayBtn.dataset.day); return; }
    if (e.target.closest("[data-clear]")){ applyDatePick(""); return; }
    if (e.target.closest("[data-today]")){
      var st2 = datePopupState;
      if (!st2) return;
      var t2 = new Date();
      st2.y = t2.getFullYear(); st2.m = t2.getMonth()+1;
      renderDatePopup();
      if (st2.anchor) positionDatePopup(st2.anchor);
      return;
    }
  });

  document.addEventListener("click", function(e){
    var groupToggle = e.target.closest("[data-wa-group-toggle]");
    if (groupToggle){ toggleGroup(groupToggle.dataset.waGroupToggle); return; }

    var dateBtn = e.target.closest("[data-wa-date-btn]");
    if (dateBtn){ openDatePopup(dateBtn); return; }
    if (datePopupState){
      var path = typeof e.composedPath === "function" ? e.composedPath() : [];
      if (path.indexOf(datePopupEl) === -1) closeDatePopup();
    }

    var del = e.target.closest('[data-wa-action="delete"]');
    if (del){ openDeleteConfirm(del.dataset.id); return; }

    if (e.target.id === "confirm-modal-cancel" || e.target.id === "confirm-modal-backdrop"){
      closeConfirmModal();
      return;
    }
    if (e.target.id === "confirm-modal-delete"){
      performDelete();
      return;
    }
  });

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){
      if (datePopupState){ closeDatePopup(); return; }
      var confirmBackdrop = document.getElementById("confirm-modal-backdrop");
      if (confirmBackdrop && !confirmBackdrop.hidden){ closeConfirmModal(); }
    }
  });
  window.addEventListener("scroll", function(){ if (datePopupState) closeDatePopup(); }, true);
  window.addEventListener("resize", function(){ if (datePopupState) closeDatePopup(); });

  // ---- add row ----
  document.getElementById("add-btn").addEventListener("click", function(){
    var newRow = WA.newRow();
    state.waRows.push(newRow);
    render();
    scheduleSave();
    var input = boardEl.querySelector('[data-wa-field="no"][data-id="'+newRow.id+'"]');
    if (input){ input.focus(); document.getElementById("board-scroll").scrollTop = document.getElementById("board-scroll").scrollHeight; }
  });

  // ---- import ----
  document.getElementById("import-btn").addEventListener("click", function(){
    document.getElementById("import-input").click();
  });
  document.getElementById("import-input").addEventListener("change", function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try{
        var data = new Uint8Array(evt.target.result);
        var wb = XLSX.read(data, {type:"array", cellDates:true});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:""});
        var imported = WA.mapRows(rows);
        if (imported.length===0){
          showToast("No rows found to import.", null, null);
          return;
        }
        lastSnapshotForUndo = JSON.parse(JSON.stringify(state.waRows));
        state.waRows = state.waRows.concat(imported);
        render();
        scheduleSave();
        showToast("Imported "+imported.length+" row"+(imported.length===1?"":"s")+" from "+file.name+".", "Undo", undoLast);
      } catch(err){
        showToast("Couldn't read that file. Try exporting as .xlsx or .csv.", null, null);
      }
      e.target.value = "";
    };
    reader.readAsArrayBuffer(file);
  });

  // ---- boot ----
  async function init(){
    waControls.init();
    document.getElementById("rowheight-select").value = waControls.getRowHeight();
    loadGroupPrefs();
    updateGroupToggleBtn();
    setSaveStatus("connecting");
    await initBackend();
    setSaveStatus(backendMode === "firebase" ? "synced" : "local-saved");
    render();
    tickClock();
    setInterval(tickClock, 1000);
    renderLastUpdated();
  }
  init();
})();
</script>
</body>
</html>
